<!doctype html>
<html lang="ar" dir="rtl" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var lang = null;
        try {
          var param = new URLSearchParams(window.location.search).get("lang");
          if (param === "en" || param === "ar") lang = param;
          else lang = window.localStorage.getItem("lang");
        } catch (e) {}
        if (lang !== "en" && lang !== "ar") lang = "ar";
        root.lang = lang;
        root.dir = lang === "ar" ? "rtl" : "ltr";
      })();
    </script>
    <meta
      name="description"
      content="سيراميك جولدن لتلميع السيارات في المصفح، أبوظبي: تنظيف وتلميع وبوليش وطلاء نانو سيراميك. نعمل يومياً 8:00 ص–9:00 م. للحجز اتصل على +971 55 215 5543."
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <title>سيراميك جولدن | تلميع سيارات ونانو سيراميك في المصفح، أبوظبي</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
